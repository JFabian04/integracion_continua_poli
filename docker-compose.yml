services:
  db:
    image: postgres:16-alpine
    container_name: tareas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tareas_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tareas-datos:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tareas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - red-tareas

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tareas-app
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-tareas_db}
    ports:
      - "8095:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-tareas

volumes:
  tareas-datos:
    name: tareas-datos
    driver: local

networks:
  red-tareas:
    name: red-tareas
    driver: bridge

